[package]
name = "protcount"
version = "0.1.0"
edition = "2024"
authors = ["Dipayan Sarkar <dipayanskr@gmail.com>"]
description = "Count amino acid composition of a protein sequence"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Dipayan26/protcount"
readme = "README.md"
keywords = ["bioinformatics", "protein", "sequence", "fasta", "cli"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }

# Smaller, faster release binaries for distribution.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
